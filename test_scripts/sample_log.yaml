  response_summary: TypeError caused by trying to concatenate string with integer
  response_full: |
    # Explanation

    In the `concatenate_strings()` function, you're trying to add a string ("Age: ")
    with an integer (25). Python strings can only be concatenated with other strings.

    ## Root Cause

    The function expects both arguments to be strings, but the second argument is an integer.

    ## Solution

    Convert the integer to a string before concatenating:

    ```python
    result2 = concatenate_strings("Age: ", str(25))
    ```

    ## Alternative Solutions

    You could also use string formatting:

    ```python
    result2 = f"Age: {25}"
    ```

    Or use format():

    ```python
    result2 = "Age: {}".format(25)
    ```
